[project]
name = "canonical-promoter-explorer"
version = "0.1.0"
description = "Interactive web companion to the canonical-promoter TF binding analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Harlan Barker" },
]
license = { text = "MIT" }

dependencies = [
    # App runtime
    "streamlit>=1.32",
    "plotly>=5.20",
    "duckdb>=1.0",

    # Data layer (also used by build_app_db.py)
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.12",

    # GO / enrichment + module recompute hooks (optional)
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
