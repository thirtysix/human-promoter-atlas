# Human Promoter Atlas — nginx vhost for tfbss.org
#
# Install on the Hetzner host as:
#   /etc/nginx/sites-available/tfbss.org
#   /etc/nginx/sites-enabled/tfbss.org  (symlink)
#
# Then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d tfbss.org -d www.tfbss.org
#
# certbot will rewrite this file in place to add the TLS server{} block plus
# the HTTP→HTTPS redirect. After certbot runs, this file no longer matches
# git; pull the post-certbot version back here with:
#   scp root@<host>:/etc/nginx/sites-available/tfbss.org deploy/nginx-tfbss.conf

# HTTP server — certbot will add a 301 redirect to HTTPS after issuing.
server {
    server_name tfbss.org www.tfbss.org;

    # Streamlit WebSocket — long-lived; must be its own location with upgrade
    # headers, otherwise the page loads but never finishes connecting.
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # Static files served by nginx directly (faster, doesn't wake Streamlit).
    location = /robots.txt {
        alias /opt/canonical-promoters/deploy/static/robots.txt;
        access_log off;
    }

    # Everything else → Streamlit
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        # Streamlit serves chunks; small buffers keep TTFB low.
        proxy_buffering off;
    }

    # Security headers — applied to all responses from this vhost.
    # CSP is permissive on inline/eval because Streamlit + Plotly require both.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # AUDIT M2: connect-src tightened from "'self' wss: ws:" to just "'self'"
    # — same-origin ws/wss is already covered.
    # media-src 'self' data: was added after the post-enforcement browser
    # report flagged a data: media resource (Streamlit / Plotly internals
    # use data: URIs for some asset; default-src 'self' was blocking them).
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Compression for text payloads (Plotly JSON benefits a lot).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Reasonable upload cap; bump if you add file-upload features.
    client_max_body_size 10M;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tfbss.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tfbss.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.tfbss.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tfbss.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tfbss.org www.tfbss.org;
    return 404; # managed by Certbot




}